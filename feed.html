<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the room built &middot; Build with Claude</title>
<meta name="description" content="Everything built at the Build with Claude workshop.">
<link rel="stylesheet" href="/assets/wall-fonts.css">
<style>
:root{
  --bg:#26262a; --well:#1b1b1e; --cream:#E7E2D1;
  --cream-dim:rgba(231,226,209,0.78); --cream-faint:rgba(231,226,209,0.44);
  --line:rgba(231,226,209,0.2); --red:#E73C3E; --green:#4FB37E; --blue:#4C68E0; --amber:#E8A33D;
  --font-display:"Futura Passata","Jost","Futura",sans-serif;
  --font-body:"Spline Sans","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--cream); font-family:var(--font-body);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:clamp(1.2rem,3.5vw,2.8rem) clamp(1rem,3.5vw,2.8rem);
}
.wrap{max-width:1400px;margin:0 auto}

header{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:clamp(1.2rem,3vw,2.6rem); align-items:center; margin-bottom:clamp(1.4rem,3vw,2.4rem)}
@media (max-width:760px){ header{grid-template-columns:1fr} }
.kicker{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.14em;
  font-size:.72rem; color:var(--cream-faint); margin:0 0 .5rem;
}
h1{
  font-family:var(--font-display); font-weight:700; line-height:.95;
  font-size:clamp(2.2rem,7vw,5rem); margin:0 0 .5rem; letter-spacing:-.01em;
}
.count{color:var(--cream-dim); margin:0; font-size:1rem}
.count b{color:var(--cream); font-family:var(--font-display); font-size:1.2rem}

/* The scan panel: this is what gets projected, so the QR is big and on cream. */
.scan{display:flex; align-items:center; gap:1.1rem; background:var(--well); border:1px solid var(--line); border-radius:14px; padding:1rem 1.2rem}
.qr-tile{background:var(--cream); border-radius:10px; padding:.55rem; width:clamp(116px,15vw,156px); flex:0 0 auto}
.qr-tile svg{display:block; width:100%; height:auto; color:var(--well)}
.scan .t{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.1em; font-size:.7rem; color:var(--cream-faint); margin:0 0 .25rem}
.scan .b{font-family:var(--font-display); font-size:clamp(1.1rem,2vw,1.6rem); line-height:1.05; margin:0 0 .4rem}
.scan .u{font-size:.8rem; color:var(--cream-faint); word-break:break-all; margin:0}
@media (max-width:420px){ .scan{flex-direction:column; text-align:center} }

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:clamp(.8rem,1.6vw,1.2rem)}
.entry{background:var(--well); border:1px solid var(--line); border-radius:13px; padding:1.1rem 1.15rem; display:flex; flex-direction:column; gap:.5rem}
.entry .top{display:flex; align-items:baseline; justify-content:space-between; gap:.6rem}
.who{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.1em; font-size:.7rem; color:var(--cream-faint)}
.when{font-size:.7rem; color:var(--cream-faint); white-space:nowrap}
.entry h2{font-family:var(--font-display); font-size:1.32rem; line-height:1.1; margin:0; letter-spacing:-.005em}
.note{color:var(--cream-dim); font-size:.9rem; margin:0}
.excerpt{
  font-size:.78rem; color:var(--cream-faint); line-height:1.5; margin:0;
  border-left:2px solid var(--line); padding-left:.65rem;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.acts{display:flex; flex-wrap:wrap; gap:.45rem; margin-top:auto; padding-top:.35rem}
.act{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.08em; font-size:.68rem;
  text-decoration:none; color:var(--cream); border:1px solid var(--line); border-radius:7px;
  padding:.36rem .66rem; background:none; cursor:pointer; transition:border-color .15s, background .15s;
}
.act:hover{border-color:var(--cream-dim); background:rgba(231,226,209,0.07)}
.act.primary{border-color:rgba(231,60,62,0.6); color:#fff; background:rgba(231,60,62,0.22)}
.tag{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.1em;
  font-size:.62rem; padding:.18rem .45rem; border-radius:5px; color:var(--well); flex:0 0 auto;
}
.tag.html{background:var(--amber)} .tag.markdown{background:var(--blue); color:#fff} .tag.text{background:var(--cream-faint)}
.frame{width:100%; height:340px; border:1px solid var(--line); border-radius:9px; background:#fff; margin-top:.3rem}

/* Remove sits apart from the links, quiet until you reach for it. */
.act.rm{margin-left:auto; color:var(--cream-faint); border-color:transparent}
.act.rm:hover{color:var(--red); border-color:rgba(231,60,62,0.5); background:rgba(231,60,62,0.1)}
.act.rm.armed{color:#fff; background:rgba(231,60,62,0.3); border-color:var(--red)}
.entry.going{opacity:.35; transition:opacity .25s}

/* Undo lives outside the grid so the 20s refresh cannot sweep it away. */
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:1.1rem; z-index:20;
  display:flex; flex-direction:column-reverse; gap:.5rem; width:min(440px,calc(100vw - 2rem))}
.toast{display:flex; align-items:center; gap:.8rem; background:var(--well);
  border:1px solid var(--line); border-radius:11px; padding:.7rem .8rem .7rem 1rem;
  box-shadow:0 .6rem 1.8rem rgba(0,0,0,.5); font-size:.86rem; animation:rise .2s ease}
.toast .what{flex:1; min-width:0; color:var(--cream-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.toast .what b{color:var(--cream)}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

.empty{border:1px dashed var(--line); border-radius:13px; padding:2.4rem 1.4rem; text-align:center; color:var(--cream-faint)}
.empty b{display:block; font-family:var(--font-display); font-size:1.3rem; color:var(--cream-dim); margin-bottom:.3rem}
footer{margin-top:2.2rem; padding-top:1rem; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-size:.8rem; color:var(--cream-faint)}
footer a{color:var(--cream-dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="kicker">Build with Claude &middot; Wintercircus</p>
      <h1>What the room built</h1>
      <p class="count" id="count">Loading&hellip;</p>
    </div>
    <div class="scan">
      <span class="qr-tile"><svg viewBox="0 0 37 37" shape-rendering="crispEdges" role="img" aria-label="QR code to the submit page"><path d="M2 2.5h7m2 0h4m2 0h2m1 0h1m3 0h1m1 0h1m1 0h7m-33 1h1m5 0h1m2 0h1m1 0h1m5 0h2m1 0h3m3 0h1m5 0h1m-33 1h1m1 0h3m1 0h1m2 0h2m1 0h5m1 0h1m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h4m1 0h1m2 0h2m3 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m2 0h3m1 0h1m1 0h6m3 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m5 0h1m1 0h2m1 0h1m1 0h1m1 0h2m1 0h1m3 0h1m3 0h1m5 0h1m-33 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-25 1h2m1 0h1m2 0h1m1 0h1m1 0h1m3 0h1m-22 1h2m3 0h1m3 0h1m1 0h2m1 0h1m3 0h2m2 0h2m1 0h2m1 0h1m-30 1h2m1 0h1m5 0h1m3 0h2m1 0h1m2 0h2m1 0h3m1 0h1m2 0h1m2 0h1m-33 1h3m1 0h4m1 0h2m2 0h3m1 0h3m2 0h3m1 0h1m2 0h4m-33 1h2m2 0h2m1 0h2m2 0h1m3 0h2m1 0h1m3 0h1m1 0h2m1 0h3m1 0h2m-33 1h1m4 0h2m2 0h5m1 0h6m5 0h2m3 0h2m-32 1h4m3 0h1m3 0h3m2 0h2m3 0h3m1 0h2m1 0h4m-33 1h1m1 0h1m1 0h1m1 0h1m4 0h2m3 0h1m2 0h2m2 0h2m4 0h1m2 0h1m-30 1h1m3 0h1m1 0h1m1 0h3m2 0h1m1 0h1m1 0h1m1 0h1m2 0h2m2 0h1m-30 1h2m1 0h1m2 0h1m1 0h2m1 0h2m3 0h1m1 0h3m2 0h2m1 0h2m3 0h1m-32 1h6m1 0h1m1 0h1m1 0h1m2 0h3m1 0h3m2 0h2m1 0h1m2 0h1m1 0h2m-33 1h1m2 0h2m1 0h1m4 0h4m3 0h2m1 0h1m1 0h1m3 0h1m1 0h2m1 0h1m-32 1h3m1 0h1m2 0h1m1 0h1m1 0h3m1 0h2m2 0h1m1 0h1m5 0h2m-30 1h1m1 0h1m1 0h1m1 0h1m4 0h2m1 0h1m1 0h3m6 0h3m4 0h1m-32 1h3m1 0h1m1 0h3m4 0h2m2 0h4m1 0h2m1 0h2m1 0h1m2 0h1m-33 1h2m4 0h2m2 0h1m1 0h3m1 0h2m1 0h1m1 0h3m1 0h3m1 0h1m2 0h1m-31 1h2m1 0h1m6 0h1m1 0h1m1 0h1m5 0h1m3 0h1m2 0h1m1 0h2m-33 1h3m1 0h3m2 0h1m1 0h6m3 0h1m2 0h7m1 0h1m-24 1h1m1 0h1m3 0h3m1 0h2m2 0h1m1 0h1m3 0h1m2 0h2m-33 1h7m2 0h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m5 0h1m3 0h1m1 0h1m1 0h4m5 0h2m3 0h2m2 0h1m-33 1h1m1 0h3m1 0h1m3 0h1m1 0h4m2 0h1m1 0h1m2 0h6m-29 1h1m1 0h3m1 0h1m2 0h4m3 0h2m1 0h2m2 0h1m1 0h1m1 0h3m2 0h1m-33 1h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h2m1 0h5m1 0h1m2 0h1m2 0h2m1 0h3m-33 1h1m5 0h1m1 0h3m1 0h2m2 0h1m1 0h1m1 0h1m3 0h6m-30 1h7m2 0h3m3 0h2m1 0h1m1 0h1m3 0h2m1 0h2m3 0h1" stroke="currentColor" stroke-width="1" fill="none"/></svg></span>
      <div>
        <p class="t">Scan to add yours</p>
        <p class="b">Put it on the wall</p>
        <p class="u">build-with-agents.vercel.app/submit</p>
      </div>
    </div>
  </header>

  <div id="list" class="grid"></div>
  <div class="toasts" id="toasts"></div>

  <footer>
    <span>Refreshes every 20 seconds. Anyone can remove a card &mdash; nothing is lost, removals can be undone.</span>
    <span><a href="/submit">Add yours</a> &middot; <a href="/">Back to the talk</a></span>
  </footer>
</div>

<script>
(function(){
  var list=document.getElementById('list'), count=document.getElementById('count');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function ago(iso){
    var s=(Date.now()-new Date(iso).getTime())/1000;
    if(!isFinite(s)) return '';
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }

  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'link'; } }

  function card(e){
    var el=document.createElement('article');
    el.className='entry';
    var title=e.title || (e.link ? host(e.link) : (e.file? e.file.name : 'Untitled'));
    var html='';
    html+='<div class="top"><span class="who">'+esc(e.name)+'</span><span class="when">'+ago(e.createdAt)+'</span></div>';
    html+='<h2>'+esc(title)+'</h2>';
    if(e.note) html+='<p class="note">'+esc(e.note)+'</p>';
    if(e.file && e.file.excerpt) html+='<p class="excerpt">'+esc(e.file.excerpt)+'</p>';
    html+='<div class="acts">';
    if(e.link) html+='<a class="act primary" target="_blank" rel="noopener noreferrer nofollow" href="'+esc(e.link)+'">'+esc(host(e.link))+' &nearr;</a>';
    if(e.file){
      html+='<span class="tag '+esc(e.file.kind)+'">'+esc(e.file.kind)+'</span>';
      html+='<a class="act" target="_blank" rel="noopener noreferrer" href="'+esc(e.file.url)+'">Open '+esc(e.file.name)+' &nearr;</a>';
      if(e.file.kind==='html') html+='<button class="act" data-peek="'+esc(e.file.url)+'">Preview</button>';
    }
    html+='<button class="act rm" data-rm="'+esc(e.id)+'">Remove</button>';
    html+='</div>';
    el.innerHTML=html;

    // Two taps to remove: the first arms the button, and it disarms itself after
    // four seconds. No modal — a confirm() would block the page.
    var rm=el.querySelector('[data-rm]'), armed=null;
    rm.addEventListener('click',function(){
      if(!armed){
        rm.classList.add('armed'); rm.textContent='Really?';
        armed=setTimeout(function(){ armed=null; rm.classList.remove('armed'); rm.textContent='Remove'; },4000);
        return;
      }
      clearTimeout(armed); armed=null;
      rm.disabled=true; rm.textContent='Removing…'; el.classList.add('going');
      fetch('/api/feed?id='+encodeURIComponent(e.id),{method:'DELETE'})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(!d.ok){ el.classList.remove('going'); rm.disabled=false; rm.textContent='Remove'; return; }
          el.remove(); delete shown[e.id];
          claim(e.id, 'removed');
          toast(e.id, d.title || e.name, e);
          load();
        })
        .catch(function(){ el.classList.remove('going'); rm.disabled=false; rm.textContent='Remove'; });
    });

    var peek=el.querySelector('[data-peek]');
    if(peek) peek.addEventListener('click', function(){
      var open=el.querySelector('iframe');
      if(open){ open.remove(); peek.textContent='Preview'; return; }
      var f=document.createElement('iframe');
      f.className='frame';
      // Someone else's page: sandboxed, and /api/file sends a sandbox CSP too.
      f.setAttribute('sandbox','allow-scripts');
      f.setAttribute('loading','lazy');
      f.src=peek.getAttribute('data-peek');
      el.appendChild(f);
      peek.textContent='Hide preview';
    });
    return el;
  }

  // Nothing is destroyed by the button above — the entry is only flagged — so
  // Undo is a single PUT, and it still works long after this toast is gone.
  function toast(id, label, entry){
    var t=document.createElement('div');
    t.className='toast';
    t.innerHTML='<span class="what">Removed <b></b></span>'+
                '<button class="act">Undo</button>'+
                '<button class="act" data-close>Dismiss</button>';
    t.querySelector('b').textContent=label;
    t.querySelector('.act').addEventListener('click',function(){
      t.remove();
      claim(id, 'restored', entry);
      render(lastEntries);
      fetch('/api/feed?id='+encodeURIComponent(id),{method:'PUT'}).then(load);
    });
    t.querySelector('[data-close]').addEventListener('click',function(){ t.remove(); });
    document.getElementById('toasts').appendChild(t);
    setTimeout(function(){ t.remove(); }, 15000);
  }

  // Reconcile rather than rebuild. A card that is already on screen keeps its
  // DOM node, so the 20-second poll cannot reset a half-pressed Remove button or
  // collapse a preview someone is reading.
  var shown = {};

  // The blob store is read-after-write eventual: a GET issued straight after a
  // remove can still hand back the old record and resurrect the card. So this
  // tab trusts its own recent actions over the server for half a minute.
  var pending = {};
  var PENDING_MS = 30000;

  function claim(id, state, entry){ pending[id]={state:state, entry:entry, until:Date.now()+PENDING_MS}; }

  function applyPending(entries){
    var now=Date.now();
    Object.keys(pending).forEach(function(id){ if(pending[id].until<now) delete pending[id]; });

    var out=entries.filter(function(e){ return !(pending[e.id] && pending[e.id].state==='removed'); });
    var have={};
    out.forEach(function(e){ have[e.id]=true; });
    Object.keys(pending).forEach(function(id){
      var p=pending[id];
      if(p.state==='restored' && !have[id] && p.entry) out.push(p.entry);
    });
    out.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    return out;
  }

  function render(rawEntries){
    var entries = applyPending(rawEntries);
    count.innerHTML = entries.length
      ? '<b>'+entries.length+'</b> '+(entries.length===1?'thing':'things')+' so far'
      : 'Nothing yet.';

    var empty=document.getElementById('empty');
    if(!entries.length){
      Object.keys(shown).forEach(function(id){ shown[id].remove(); delete shown[id]; });
      list.className='';
      if(!empty){
        list.innerHTML='<div class="empty" id="empty"><b>The wall is empty.</b>Scan the code and be the first one on it.</div>';
      }
      return;
    }
    if(empty){ empty.remove(); }
    list.className='grid';

    var live={};
    entries.forEach(function(e){ live[e.id]=true; });
    Object.keys(shown).forEach(function(id){
      if(!live[id]){ shown[id].remove(); delete shown[id]; }
    });

    // Walk the wanted order, inserting anything missing or out of place.
    var at=list.firstChild;
    entries.forEach(function(e){
      var el=shown[e.id];
      if(!el){ el=card(e); shown[e.id]=el; }
      if(el!==at){ list.insertBefore(el, at); } else { at=at.nextSibling; }
    });
  }

  var lastEntries=[];
  function load(){
    return fetch('/api/feed',{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.entries){ lastEntries=d.entries; render(lastEntries); }
        else count.textContent='Could not load the feed.';
      })
      .catch(function(){ count.textContent='Could not reach the feed.'; });
  }

  load();
  setInterval(function(){ if(!document.hidden) load(); }, 20000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
